lockfileIncludeTarballUrl: true
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@softarc/*"
  - "@angular/*"
  - "@angular-devkit/*"
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': true
  esbuild: true
  lmdb: true
  msgpackr-extract: false
  msw: true
  nx: false
# nx (via @nx/devkit) pins these to vulnerable versions; drop once nx ships the fixes
overrides:
  'nx>undici': '^7.29.1'
