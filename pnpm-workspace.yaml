lockfileIncludeTarballUrl: true
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@softarc/*"
  - "@angular/*"
  - "@angular-devkit/*"
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': true
  esbuild: true
  lmdb: true
  msgpackr-extract: false
  msw: true
  nx: false
# nx (via @nx/devkit) and @angular/build pin these to vulnerable versions; drop once they ship the fixes
overrides:
  'nx>undici': '^7.29.1'
  '@angular/build>vite': '^8.3.3'
